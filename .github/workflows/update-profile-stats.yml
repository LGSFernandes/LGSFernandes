name: Update Profile Stats

on:
  schedule:
    - cron: "0 */3 * * *"   # a cada 3 horas (em UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cards próprios (SVG puro, sem serviços de terceiros): nada de "imagem quebrada".
      - name: Gerar cards (status, linguagens, contribuições, LeetCode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
          LEETCODE_USER: LGSFernandes
        run: python scripts/generate_stats.py

      - name: Commit dos cards atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualiza cards do perfil"
          git push
