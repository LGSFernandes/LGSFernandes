<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" width="560" height="170" role="img" aria-label="Problemas resolvidos no LeetCode"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes blink{50%{opacity:0}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.ring{stroke-dasharray:326.7;stroke-dashoffset:326.7;animation:fill 2s .3s cubic-bezier(.2,.8,.2,1) forwards;transform:rotate(-90deg);transform-origin:80px 95px}
@keyframes fill{to{stroke-dashoffset:326.7}}
.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#0c1430"/></linearGradient>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><rect width="560" height="170" rx="14" fill="url(#bg)"/><rect x="1" y="1" width="558" height="168" rx="13" fill="none" stroke="#3b82f6" stroke-opacity=".45"/><text x="24" y="30" font-size="12" fill="#60a5fa" letter-spacing="4">[ TREINO NO LEETCODE ]</text><circle cx="80" cy="95" r="52" fill="none" stroke="#1e293b" stroke-width="10"/><circle class="ring" cx="80" cy="95" r="52" fill="none" stroke="url(#bar)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/><text x="80" y="102" text-anchor="middle" font-size="26" font-weight="800" fill="#e0f2fe">--</text><text x="80" y="118" text-anchor="middle" font-size="9" fill="#64748b" letter-spacing="2">RESOLVIDOS</text><text x="80" y="160" text-anchor="middle" font-size="9" fill="#475569">meta: 50</text><text x="170" y="73" font-size="12" fill="#e2e8f0">Fácil</text><rect x="240" y="62" width="260" height="12" rx="6" fill="#1e293b"/><rect class="bar" style="animation-delay:0.00s" x="240" y="62" width="0.0" height="12" rx="6" fill="#4ade80" filter="url(#glow)"/><text x="536" y="73" text-anchor="end" font-size="12" fill="#94a3b8">--</text><text x="170" y="103" font-size="12" fill="#e2e8f0">Médio</text><rect x="240" y="92" width="260" height="12" rx="6" fill="#1e293b"/><rect class="bar" style="animation-delay:0.15s" x="240" y="92" width="0.0" height="12" rx="6" fill="#facc15" filter="url(#glow)"/><text x="536" y="103" text-anchor="end" font-size="12" fill="#94a3b8">--</text><text x="170" y="133" font-size="12" fill="#e2e8f0">Difícil</text><rect x="240" y="122" width="260" height="12" rx="6" fill="#1e293b"/><rect class="bar" style="animation-delay:0.30s" x="240" y="122" width="0.0" height="12" rx="6" fill="#fb7185" filter="url(#glow)"/><text x="536" y="133" text-anchor="end" font-size="12" fill="#94a3b8">--</text></svg>