<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 46" width="190" height="46" role="img" aria-label="Conectar">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}.shine{animation:s 4.5s ease-in-out infinite}@keyframes s{0%,55%{transform:translateX(-80px)}100%{transform:translateX(250px)}}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a66c2"/><stop offset="1" stop-color="#084c91"/></linearGradient>
<clipPath id="c"><rect width="190" height="46" rx="12"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="190" height="46" fill="url(#g)"/>
<rect class="shine" x="0" y="-10" width="26" height="66" fill="#fff" opacity=".22" transform="skewX(-20)"/></g>
<rect x=".75" y=".75" width="188.5" height="44.5" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>
<g transform="translate(22,12)"><rect x="1" y="1" width="20" height="20" rx="4" fill="#fff"/><text x="11" y="16.5" text-anchor="middle" font-size="14" font-weight="800" fill="#0a66c2">in</text></g>
<text x="58" y="29.5" font-size="15" font-weight="700" letter-spacing="1" fill="#fff">Conectar</text>
</svg>